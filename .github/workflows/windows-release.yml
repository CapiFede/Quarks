name: Windows release

# Buildea, firma y publica el instalador de Windows en CI.
#
# Por qué CI y no `pnpm release` desde Linux: `tauri build` solo genera el bundle
# del SO donde corre (ver scripts/release.mjs), así que el `.exe` no puede salir
# desde tu máquina Linux. Este job corre en un runner Windows y sube el
# `*-setup.exe` + su `.sig` al mismo GitHub Release que ya creó el release de Linux.
#
# Dos disparadores:
#   1. `release: published` — automático. Se emite DESPUÉS de que `gh release
#      create` (dentro de pnpm release) publica el release. OJO: el evento usa el
#      workflow del COMMIT AL QUE APUNTA EL TAG, no el de main HEAD; por eso el
#      arreglo de este archivo solo aplica a releases cuyo tag ya lo incluya.
#   2. `workflow_dispatch` — manual. Re-buildea Windows para un release ya
#      publicado (p. ej. si el job automático falló). Corrélo con `--ref main`
#      para usar SIEMPRE la última versión de este workflow, sin importar a qué
#      commit apunte el tag:
#        gh workflow run windows-release.yml --ref main -f tag=v0.4.6
#
# tauri-action detecta el `latest.json` existente (con la entrada `linux-x86_64`)
# y MERGEA `windows-x86_64` encima (no lo pisa), así el updater ofrece updates a
# Linux y a Windows por igual.
#
# Requisitos (una sola vez): dos GitHub Secrets en Settings → Secrets and
# variables → Actions:
#   - TAURI_SIGNING_PRIVATE_KEY          → contenido de ~/.tauri/quarks.key
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD → el password de esa clave

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release a buildear (ej. v0.4.6)"
        required: true

permissions:
  contents: write # tauri-action sube assets y actualiza latest.json vía GITHUB_TOKEN

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Unifica los dos disparadores: del evento `release` sacamos tag + id
      # directo; del dispatch manual resolvemos el id del release vía la API a
      # partir del tag que se pasó como input.
      - name: Resolver tag + release id
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REL_TAG: ${{ github.event.release.tag_name }}
          REL_ID: ${{ github.event.release.id }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "tag=$REL_TAG" >> "$GITHUB_OUTPUT"
            echo "id=$REL_ID" >> "$GITHUB_OUTPUT"
          else
            ID="$(gh api "repos/$REPO/releases/tags/$INPUT_TAG" --jq .id)"
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "id=$ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout en el tag del release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # lee la versión de `packageManager` en package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11.3.0 (packageManager en package.json) requiere Node ≥22.13:
          # usa node:sqlite, que no existe en Node 20 y crashea el step.
          node-version: 22
          cache: pnpm

      - name: Setup Rust (toolchain MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de compilación de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias JS
        run: pnpm install --frozen-lockfile

      - name: Build + firma + subir al release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Sube al release resuelto arriba (evento o dispatch manual).
          releaseId: ${{ steps.rel.outputs.id }}
          # Solo NSIS: es el formato que el updater de Tauri usa en Windows.
          # Evita construir también el MSI (más lento y acá no lo necesitamos).
          args: --bundles nsis
          # Mergea la entrada windows-x86_64 en el latest.json ya existente.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
